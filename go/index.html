<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sugar Lane</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<!-- Built by tools/build_go.py from tools/go_template.html + apps-script/Dashboard.html. Edit those, not this file.
     Laney's private pages: dashboard, order review, Send invoice, quote replies. Links look like
     sugarlaneok.com/go/#view=dashboard&k=... The part after # never reaches the web server, and nothing
     loads without the secret key. Data comes from the order system the same way the order page gets it,
     so it works in any browser (Google's own script pages fail when a browser has several Google accounts). -->
<style>
  :root {
    color-scheme: light;
    --page: #fbf6f8; --card: #ffffff; --line: #efe3e8; --grid: #f1e9ec;
    --ink: #2b1f24; --ink-2: #6f6267; --ink-3: #9a8c92;
    --series: #c2006a; --series-soft: #f7d9e8; --up: #1d7a3a; --down: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #121111; --card: #1c1b1b; --line: #2e2b2c; --grid: #2a2728;
      --ink: #f6f1f3; --ink-2: #c4b9be; --ink-3: #8d8287;
      --series: #e0388a; --series-soft: #4a2235; --up: #5cc27d; --down: #f08a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
  h1 small { display: block; font-size: 13px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; margin-top: 2px; }
  .range { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .range a { display: inline-block; text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px; }
  .range a.on { background: var(--series); color: #fff; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .kpi .label { font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .kpi .value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .delta .up { color: var(--up); font-weight: 600; } .delta .down { color: var(--down); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card .sub { font-size: 13px; color: var(--ink-3); margin: 0 0 12px; }
  .bars { display: grid; gap: 10px; }
  .bar-row .top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .bar-row .top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .top b { font-variant-numeric: tabular-nums; }
  .bar-row .top em { font-style: normal; color: var(--ink-3); font-weight: 500; margin-left: 6px; }
  .track { height: 8px; background: var(--grid); border-radius: 4px; margin-top: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--series); border-radius: 4px; min-width: 2px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 190px; }
  .chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--card); font-size: 13px; padding: 5px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); display: none; }
  .split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--card); margin: 6px 0 10px; }
  .split div { background: var(--series); }
  .split div + div { background: var(--series-soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--ink-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--series); margin-right: 6px; vertical-align: -1px; }
  .legend span + span i { background: var(--series-soft); }
  .list { display: grid; }
  .item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .item:first-child { border-top: 0; padding-top: 2px; }
  .item .main { min-width: 0; } .item .main b { display: block; }
  .item .main span { color: var(--ink-2); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .side { text-align: right; color: var(--ink-2); flex-shrink: 0; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; color: var(--ink-2); }
  .chip b { color: var(--ink); font-size: 16px; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--ink-3); font-size: 14px; padding: 6px 0; }
  .note { font-size: 13px; color: var(--ink-3); margin-top: 16px; }
  .loading { color: var(--ink-3); padding: 40px 0; text-align: center; }
  @media (max-width: 760px) {
    .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi .value { font-size: 26px; }
    .grid { grid-template-columns: 1fr; }
    h1 { font-size: 22px; }
  }
  .page { max-width: 600px; margin: 0 auto; }
  .brand { font-family: Georgia, serif; font-size: 24px; color: var(--series); margin: 4px 0 12px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  .panel h2 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--ink-2); font-size: 14px; }
  .items { background: var(--page); border-radius: 10px; padding: 12px; white-space: pre-line; margin: 12px 0; }
  table.money { width: 100%; border-collapse: collapse; margin-top: 8px; }
  table.money td { padding: 3px 0; vertical-align: top; }
  table.money td.r { text-align: right; font-variant-numeric: tabular-nums; }
  table.money tr.total td { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; }
  .econ { background: var(--series-soft); border-radius: 10px; padding: 10px 12px; margin: 12px 0; font-size: 14px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 999px; padding: 15px; font: inherit; font-size: 17px; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; margin-top: 10px; background: #ff0082; color: #fff; }
  .btn.outline { background: transparent; color: var(--series); border: 2px solid var(--series); }
  .btn.green { background: #3f7d4e; } .btn.red { background: #9a3b3b; }
  .btn:disabled { opacity: .55; cursor: default; }
  .row2 { display: flex; gap: 10px; } .row2 .btn { flex: 1; }
  textarea { width: 100%; min-height: 80px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; margin-top: 8px; background: var(--card); color: var(--ink); }
  .result { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-weight: 600; }
  .result.ok { background: #e7f3ea; color: #2f6b3e; } .result.err { background: #f8e8e8; color: #9a3b3b; }
  .preview { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
  .range button { border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .range button.on { background: var(--series); color: #fff; }
  .hidden { display: none; }
  /* ---------- the phone app (view=app) ---------- */
  body.appmode { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
  .apptop { position: sticky; top: 0; z-index: 5; background: var(--page); display: flex; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
  .apptop .brand { margin: 0; font-size: 22px; }
  .apptop .upd { font-size: 12px; color: var(--ink-2); }
  .iconbtn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .pane { max-width: 640px; margin: 0 auto; padding: 14px 14px 20px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { flex: 1; border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 12px; font-weight: 600; padding: 9px 0 10px; cursor: pointer; position: relative; }
  .tabbar button b { display: block; font-size: 20px; line-height: 1.1; }
  .tabbar button.on { color: var(--series); }
  .tabbar .badge { position: absolute; top: 4px; left: 50%; margin-left: 8px; background: #ff0082; color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 6px; }
  .sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 18px 4px 8px; font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .card .nm { font-weight: 700; font-size: 16px; }
  .card .sub { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; background: var(--series-soft); color: var(--series); white-space: nowrap; }
  .pill.New { background: #fff1cc; color: #8a6200; } .pill.Quoted { background: #fde7f1; color: #b0005c; }
  .pill.Ready { background: #e3edfb; color: #2a5a9e; } .pill.Invoiced { background: #efe6fb; color: #6a3fa0; }
  .pill.Paid { background: #e3f2e6; color: #2f6b3e; } .pill.Done, .pill.Declined, .pill.Expired { background: #eee; color: #666; }
  .pill.Waiting { background: #fff1cc; color: #8a6200; } .pill.Approved { background: #e3f2e6; color: #2f6b3e; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
  .chips button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .chips button.on { background: var(--series); border-color: var(--series); color: #fff; }
  .empty { text-align: center; color: var(--ink-2); padding: 30px 10px; }
  .sheet { position: fixed; inset: 0; z-index: 10; background: var(--page); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet .pane { padding-bottom: 60px; }
  .contact { display: flex; gap: 8px; margin: 12px 0; }
  .contact a { flex: 1; text-align: center; text-decoration: none; border: 1px solid var(--line); background: var(--card); color: var(--series); border-radius: 12px; padding: 10px 4px; font-weight: 700; font-size: 14px; }
  dl.kv { margin: 8px 0 0; display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 15px; }
  dl.kv dt { color: var(--ink-2); } dl.kv dd { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .photos a img { width: 86px; height: 86px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .field { margin-top: 12px; } .field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; }
  .field input, .field select { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 16px; background: var(--card); color: var(--ink); }
  .two { display: flex; gap: 10px; } .two .field { flex: 1; }
  .hint { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sugar Lane">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ff0082">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="wrap" id="root"><p class="loading">Loading…</p></div>
<script src="/config.js"></script>
<script>
  var API = (window.SUGAR_LANE_CONFIG || {}).API_URL;
  var P = {};
  location.hash.slice(1).split('&').forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf('='), k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
    P[k] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
  });
  var root = document.getElementById('root');

  // Google's script server now and then hangs or returns a one-off error page, so give each try
  // 40 seconds (the dashboard's first load of the day is slow) and retry up to 3 times.
  function getData(params, tries) {
    tries = tries || 1;
    var q = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl && setTimeout(function () { ctrl.abort(); }, 40000);
    return fetch(API + '?action=owner&' + q + '&t=' + Date.now(), ctrl ? { signal: ctrl.signal } : {})
      .then(function (r) { return r.json(); })
      .then(function (d) { clearTimeout(timer); return d; }, function (err) {
        clearTimeout(timer);
        if (tries >= 3) throw err;
        return getData(params, tries + 1);
      });
  }
  function postData(body) {
    body.action = 'owner';
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }
  function fail(msg) { root.innerHTML = '<div class="page"><div class="brand">Sugar Lane</div><div class="panel"><p>' + esc(msg) + '</p></div></div>'; }
  function netFail() { fail('Couldn’t reach the order system. Check your connection and refresh the page.'); }
  /** Disable the buttons, run the request, then show the result under them. */
  function act(btns, busyText, run, onOk, resEl) {
    var res = resEl || document.getElementById('result');
    btns.forEach(function (b) { b.disabled = true; });
    res.className = 'result ok'; res.textContent = busyText;
    run().then(function (r) {
      if (r.ok) { res.className = 'result ok'; res.innerHTML = '<b>Done!</b> ' + esc(r.message || ''); if (onOk) onOk(r); }
      else { res.className = 'result err'; res.textContent = r.error || 'Something went wrong.'; btns.forEach(function (b) { b.disabled = false; }); }
    }).catch(function () { res.className = 'result err'; res.textContent = 'Couldn’t reach the order system. Please try again.'; btns.forEach(function (b) { b.disabled = false; }); });
  }

  // ---------- dashboard (drawing code shared with apps-script/Dashboard.html) ----------
  var days = Number(P.days) || 30, last = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function n(x) { return Number(x || 0).toLocaleString('en-US'); }
  function money(x) { return '$' + Number(x || 0).toLocaleString('en-US', { maximumFractionDigits: 0 }); }

  /** "12% more than the 30 days before" */
  function delta(cur, prev) {
    if (!prev && !cur) return 'No change';
    if (!prev) return '<span class="up">New</span> vs the ' + days + ' days before';
    var pct = Math.round((cur - prev) / prev * 100);
    if (pct === 0) return 'Same as the ' + days + ' days before';
    return '<span class="' + (pct > 0 ? 'up' : 'down') + '">' + (pct > 0 ? '▲ ' : '▼ ') + Math.abs(pct) + '%</span> vs the ' + days + ' days before';
  }

  function kpi(label, value, d) {
    return '<div class="kpi"><div class="label">' + label + '</div><div class="value">' + value + '</div><div class="delta">' + d + '</div></div>';
  }

  /** Horizontal bars: [[label, value], ...]. Values are printed, so the bars never carry meaning alone. */
  function bars(rows, opts) {
    opts = opts || {};
    if (!rows || !rows.length || !rows.some(function (r) { return r[1] > 0; })) return '<p class="empty">' + (opts.empty || 'Nothing yet.') + '</p>';
    var max = Math.max.apply(null, rows.map(function (r) { return r[1]; })) || 1;
    var base = opts.pctOf || 0;
    return '<div class="bars">' + rows.map(function (r) {
      var pct = base ? ' <em>' + Math.round(r[1] / base * 100) + '%</em>' : '';
      return '<div class="bar-row"><div class="top"><span>' + esc(r[0]) + '</span><span><b>' + (opts.money ? money(r[1]) : n(r[1])) + '</b>' + pct + '</span></div>' +
        '<div class="track"><div class="fill" style="width:' + (r[1] / max * 100) + '%"></div></div></div>';
    }).join('') + '</div>';
  }

  function card(title, sub, body, wide) {
    return '<section class="card' + (wide ? ' wide' : '') + '"><h2>' + title + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + body + '</section>';
  }

  /** Visitors per day: one series, thin rounded bars, hairline grid, tap or hover for the exact number. */
  function dailyChart(el, daily) {
    var w = el.clientWidth || 600, h = 190, padL = 28, padB = 22, padT = 10;
    var max = Math.max(1, Math.max.apply(null, daily.map(function (d) { return d[1]; })));
    var step = Math.pow(10, Math.floor(Math.log10(max))); var top = Math.ceil(max / step) * step; if (top < 4) top = 4;
    var plotW = w - padL, plotH = h - padB - padT, slot = plotW / daily.length, bw = Math.max(2, Math.min(18, slot - 2));
    var y = function (v) { return padT + plotH - v / top * plotH; };
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Visitors per day">';
    [0, top / 2, top].forEach(function (v) {
      svg += '<line x1="' + padL + '" x2="' + w + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--grid)" stroke-width="1"/>' +
        '<text x="' + (padL - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--ink-3)">' + n(v) + '</text>';
    });
    daily.forEach(function (d, i) {
      var x = padL + i * slot + (slot - bw) / 2, bh = d[1] / top * plotH;
      if (d[1] > 0) {
        var r = Math.min(4, bw / 2, bh);
        svg += '<path data-i="' + i + '" fill="var(--series)" d="M' + x + ',' + (padT + plotH) + 'V' + (y(d[1]) + r) +
          'q0,-' + r + ' ' + r + ',-' + r + 'H' + (x + bw - r) + 'q' + r + ',0 ' + r + ',' + r + 'V' + (padT + plotH) + 'Z"/>';
      }
    });
    [0, Math.floor((daily.length - 1) / 2), daily.length - 1].forEach(function (i, k) {
      var x = padL + i * slot + slot / 2;
      svg += '<text x="' + x + '" y="' + (h - 5) + '" text-anchor="' + (k === 0 ? 'start' : k === 2 ? 'end' : 'middle') + '" font-size="11" fill="var(--ink-3)">' + esc(daily[i][0]) + '</text>';
    });
    svg += '<line id="hoverLine" x1="0" x2="0" y1="' + padT + '" y2="' + (padT + plotH) + '" stroke="var(--ink-3)" stroke-width="1" style="display:none"/></svg>';
    el.innerHTML = svg + '<div class="tip"></div>';
    var s = el.querySelector('svg'), tip = el.querySelector('.tip'), line = el.querySelector('#hoverLine');
    function show(ev) {
      var rect = s.getBoundingClientRect(), px = (ev.clientX - rect.left) * (w / rect.width);
      var i = Math.max(0, Math.min(daily.length - 1, Math.floor((px - padL) / slot)));
      var cx = padL + i * slot + slot / 2;
      line.setAttribute('x1', cx); line.setAttribute('x2', cx); line.style.display = '';
      tip.style.display = 'block';
      tip.style.left = (cx / w * rect.width) + 'px';
      tip.style.top = (Math.min(y(daily[i][1]), padT + plotH - 4) / h * rect.height - 6) + 'px';
      tip.textContent = daily[i][0] + ' · ' + n(daily[i][1]) + (daily[i][1] === 1 ? ' visitor' : ' visitors');
    }
    s.addEventListener('pointermove', show);
    s.addEventListener('pointerdown', show);
    s.addEventListener('pointerleave', function () { tip.style.display = 'none'; line.style.display = 'none'; });
  }

  function render(d) {
    last = d;
    document.getElementById('updated').textContent = 'Last ' + d.days + ' days · updated ' + d.updated;
    var w = d.web, o = d.orders, c = d.custom;
    var sales = o.sales + c.sales, prevSales = o.prevSales + c.prevSales;
    var html = '<div class="kpis">' +
      kpi('Website visitors', w ? n(w.visitors) : '–', w ? delta(w.visitors, w.prevVisitors) : 'Not available yet') +
      kpi('Custom requests', n(c.received), delta(c.received, c.prevReceived)) +
      kpi('Online orders', n(o.placed), delta(o.placed, o.prevPlaced)) +
      kpi('Sales', money(sales), delta(sales, prevSales)) +
      '</div><div class="grid">';

    if (w) {
      html += card('Visitors per day', n(w.now) + (w.now === 1 ? ' person' : ' people') + ' on the site right now · tap a bar for the number', '<div class="chart" id="daily"></div>', true);
      html += card('Where visitors came from', 'Visits by source', bars(w.sources, { empty: 'No visits yet. Google takes about a day to show new visits.' }));
      html += card('Path to an order', 'Visitors who reached each step', bars(w.funnel, { pctOf: w.funnel[0][1], empty: 'No visits yet.' }) +

      '<div class="field"><label>Pickup date</label><input id="f-date" type="date" value="' + esc(c.pickupDate) + '"></div>' +
      '<button class="btn" id="save">Save</button><div id="result" class="hidden"></div>' +
      '<div style="margin-top:14px">' + invoiceBlock + '</div><div id="result2" class="hidden"></div></div>' +

      '<div class="panel"><h2>Reply to ' + esc(String(c.name).split(' ')[0]) + '</h2>' +
      '<div class="field"><label>Reply</label><select id="r-type"><option value="">Pick a reply…</option>' + opts(d.replyTypes, '') + '</select></div>' +
      '<div class="field"><label>Personal note (needed for Need more info)</label><textarea id="r-msg">' + esc(c.message) + '</textarea></div>' +
      '<button class="btn outline" id="preview">Preview</button><div id="result3" class="hidden"></div><div id="pv"></div></div>');

    var run = function (resultId, btns, busy, body, after) {
      act(btns, busy, function () { return postData(body); }, function (r) { if (after) after(r); }, document.getElementById(resultId));
    };
    document.getElementById('save').onclick = function () {
      run('result', [this], 'Saving…', { op: 'appSave', k: P.k, id: c.id, fields: {
        status: document.getElementById('f-status').value, quote: document.getElementById('f-quote').value,
        pickupDate: document.getElementById('f-date').value, pickupTime: document.getElementById('f-time').value } },
        function () { loadApp(true); });
    };
    var inv = document.getElementById('sendInv');
    if (inv) inv.onclick = function () {
      if (!confirm('Email the ' + money(c.quote + tax) + ' invoice to ' + c.email + '?')) return;
      run('result2', [inv], 'Sending the invoice…', { op: 'appInvoice', k: P.k, id: c.id }, function () { loadApp(true); });
    };
    document.getElementById('preview').onclick = function () {
      var type = document.getElementById('r-type').value, msg = document.getElementById('r-msg').value, pbtn = this;
      if (!type) return alert('Pick a reply first.');
      run('result3', [pbtn], 'Making the preview…', { op: 'appPreview', k: P.k, id: c.id, reply: type, message: msg }, function (r) {
        document.getElementById('result3').className = 'hidden';
        document.getElementById('pv').innerHTML = '<p class="muted">To ' + esc(r.email) + ' · ' + esc(r.subject) + '</p><div class="preview">' + r.html + '</div>' +
          '<button class="btn" id="sendR">Send email</button>' + (r.canText ? '<button class="btn outline" id="textR">Text it instead</button>' : '') + '<div id="result4" class="hidden"></div>';
        var sb = [].slice.call(document.querySelectorAll('#pv button'));
        var send = function (how) {
          run('result4', sb, 'Sending…', { op: 'appReply', k: P.k, id: c.id, reply: type, message: msg, how: how }, function (res) {
            sb.forEach(function (b) { b.classList.add('hidden'); });
            if (res.sms) location.href = res.sms;
            loadApp(true);
          });
        };
        document.getElementById('sendR').onclick = function () { send('email'); };
        var t = document.getElementById('textR'); if (t) t.onclick = function () { send('text'); };
      });
    };
  }

  function drawDash(pane) {
    pane.innerHTML = '<header><h1 style="font-size:20px">Website &amp; sales<small id="updated">Loading…</small></h1><div class="range" id="range">' +
      [7, 30, 90].map(function (n) { return '<button data-d="' + n + '"' + (n === days ? ' class="on"' : '') + '>' + n + ' days</button>'; }).join('') +
      '</div></header><div id="app"><p class="loading">Loading your numbers…</p></div>';
    pane.onclick = null;
    document.getElementById('range').onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      days = Number(b.getAttribute('data-d'));
      [].forEach.call(this.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
      loadDash();
    };
    if (last && last.days === days) render(last); else loadDash();
  }

  // The home-screen icon opens the link it was saved from; keep the key in case the # part ever gets dropped.
  try { if (P.k) localStorage.setItem('slKey', P.k); else if (P.view === 'app') P.k = localStorage.getItem('slKey') || ''; } catch (e) {}

  if (!API || !P.k) fail('This link is missing its key. Open it again from the Sheet or the email.');
  else if (P.view === 'app') appView();
  else if (P.view === 'dashboard') dashboard();
  else if (P.action === 'review') review();
  else if (P.action === 'invoice') invoice();
  else if (P.action === 'reply') reply();
  else fail('This link isn’t recognized.');
</script>
</body>
</html>
