<title>Opening… | Sugar Lane</title>
<!-- Links in Sugar Lane's own emails and Sheet point here (sugarlaneok.com/go/#view=dashboard&k=...).
     Google's apps rewrite direct script.google.com links to /u/N/, which fails when a browser is signed
     into several Google accounts; a link to this site isn't rewritten. The part after # never reaches the server. -->
<script src="/config.js"></script>
<script>
  var q = location.hash.slice(1);
  if (q && window.SUGAR_LANE_CONFIG && SUGAR_LANE_CONFIG.API_URL) location.replace(SUGAR_LANE_CONFIG.API_URL + '?' + q);
</script>
</head>

  <p>Opening…</p>
</body>
